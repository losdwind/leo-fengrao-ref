<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="李奥《丰饶之海》首页排版静帧">
  <title>丰饶之海 · 李奥</title>
  <style>
    :root {
      color-scheme: dark;
      --page-x: clamp(22px, 4.65vw, 76px);
      --page-y: clamp(24px, 5.2vh, 60px);
      --paper: #fff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05080a;
    }

    body {
      color: var(--paper);
      font-family: "Arial Narrow", "Helvetica Neue", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100svh;
      isolation: isolate;
      overflow: hidden;
      background: #05080a;
    }

    .frame::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(0, 0, 0, .24);
      content: "";
      pointer-events: none;
    }

    .background,
    .portrait-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }

    .background {
      z-index: -3;
    }

    .portrait-overlay {
      z-index: -2;
      opacity: .58;
      mix-blend-mode: screen;
    }

    .artist {
      position: absolute;
      top: var(--page-y);
      left: var(--page-x);
      width: clamp(92px, 10vw, 158px);
      margin: 0;
    }

    .artist img,
    .album-title img {
      display: block;
      width: 100%;
      height: auto;
    }

    .album-title img {
      filter: brightness(0) invert(1);
    }

    .album-title {
      position: absolute;
      top: 24%;
      left: var(--page-x);
      width: min(45vw, 720px);
      margin: 0;
    }

    .thesis {
      position: absolute;
      top: 72%;
      left: 50%;
      margin: 0;
      transform: translateX(-50%);
      color: var(--paper);
      font-size: clamp(14px, 1.18vw, 19px);
      font-weight: 400;
      letter-spacing: .34em;
      line-height: 1.4;
      text-align: center;
      text-indent: .34em;
      white-space: nowrap;
      text-shadow: 0 1px 20px rgba(0, 0, 0, .42);
    }

    .chapters {
      position: absolute;
      right: var(--page-x);
      bottom: var(--page-y);
      left: var(--page-x);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: baseline;
      font-size: clamp(11px, .78vw, 13px);
      font-weight: 400;
      letter-spacing: .08em;
      line-height: 1.4;
      text-shadow: 0 1px 16px rgba(0, 0, 0, .56);
    }

    .chapters span:nth-child(2) {
      text-align: center;
    }

    .chapters span:last-child {
      text-align: right;
    }

    @media (max-width: 720px) {
      .artist {
        width: clamp(86px, 25vw, 118px);
      }

      .album-title {
        top: 37%;
        left: var(--page-x);
        width: min(72vw, 430px);
      }

      .thesis {
        top: 64%;
        font-size: clamp(13px, 3.5vw, 16px);
        letter-spacing: .24em;
        text-indent: .24em;
      }

      .chapters {
        font-size: 11px;
        letter-spacing: .05em;
      }
    }

    @media (max-height: 560px) {
      .artist {
        width: 82px;
      }

      .album-title {
        top: 22%;
        left: var(--page-x);
        width: min(44vw, 620px);
      }

      .thesis {
        top: 69%;
      }
    }
  </style>
</head>
<body>
  <main class="frame" aria-label="李奥《丰饶之海》首页">
    <img class="background" src="./scene-assets/home-still.jpg" alt="">
    <img class="portrait-overlay" src="./scene-assets/portrait.JPG" alt="">

    <h1 class="artist">
      <img src="./scene-assets/home-artist.png" alt="李奥">
    </h1>

    <div class="album-title" role="img" aria-label="丰饶之海">
      <img src="./scene-assets/home-title.png" alt="">
    </div>

    <p class="thesis">在匮乏中抵达丰饶</p>

    <div class="chapters" aria-label="专辑三章：出发、发现、融解">
      <span>出发</span>
      <span>发现</span>
      <span>融解</span>
    </div>
  </main>
</body>
</html>
